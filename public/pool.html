<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>账号池管理</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36;
    --text: #e6e9ef; --muted: #8b93a3;
    --accent: #4f8cff; --ok: #34c77b; --warn: #f0b429; --bad: #ef5b5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; padding: 24px; max-width: 860px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; font-size: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, button {
    background: #1f242e; border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  input.wide { flex: 1; min-width: 180px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:hover { filter: brightness(1.15); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.ok   { background: rgba(52,199,123,.15); color: var(--ok); }
  .tag.bad  { background: rgba(239,91,91,.15); color: var(--bad); }
  .tag.warn { background: rgba(240,180,41,.15); color: var(--warn); }
  .tag.off  { background: rgba(139,147,163,.15); color: var(--muted); }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.err { color: var(--bad); }
  .msg.okk { color: var(--ok); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>账号池管理</h1>
<div class="sub">qwen-intl-api · 服务端账号池 · 对话接口未带 Authorization 时自动从这里轮询取号</div>

<div class="card">
  <div class="row">
    <input id="adminToken" class="wide" type="password" placeholder="管理令牌（QWEN_ADMIN_TOKEN）"/>
    <button class="primary" onclick="saveToken()">保存</button>
    <button onclick="loadList()">刷新列表</button>
  </div>
  <div id="authMsg" class="msg"></div>
</div>

<div class="card">
  <div class="row">
    <input id="email" class="wide" placeholder="email（如 1@email.lxseek.com）"/>
    <input id="password" class="wide" type="password" placeholder="密码"/>
    <button class="primary" onclick="addOne()">添加</button>
  </div>
  <details style="margin-top:10px">
    <summary>批量导入（每行一个账号，格式 email:密码）</summary>
    <textarea id="bulkEmails" rows="4" style="width:100%;margin-top:8px" placeholder="1@email.lxseek.com:pass1&#10;2@email.lxseek.com:pass2"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" onclick="importBulk()">批量导入</button>
    </div>
  </details>
  <div id="addMsg" class="msg"></div>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>#</th><th>账号</th><th>状态</th><th>失败</th><th>最近使用</th><th style="width:190px">操作</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="listMsg" class="empty">先填管理令牌，然后点「刷新列表」</div>
</div>

<script>
const $ = id => document.getElementById(id);
const API = '';

function getToken() { return localStorage.getItem('qwen_admin_token') || ''; }
function saveToken() {
  localStorage.setItem('qwen_admin_token', $('adminToken').value.trim());
  show('authMsg', '已保存到 localStorage（仅存在本机浏览器）', true);
  loadList();
}
function show(id, text, ok) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'okk' : 'err');
}

async function api(method, path, body) {
  const token = getToken();
  const opt = {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
  };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const resp = await fetch(API + path, opt);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.message || data.errmsg || `HTTP ${resp.status}`);
  return data;
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function statusTag(a) {
  if (a.disabled) return '<span class="tag off">已禁用</span>';
  if (a.cooling) return `<span class="tag warn">冷却 ${a.cooldownRemainSec}s</span>`;
  if (a.failCount > 0) return `<span class="tag warn">失败 ${a.failCount} 次</span>`;
  return '<span class="tag ok">正常</span>';
}

// email 转义后再进 innerHTML/onclick，防注入
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

async function loadList() {
  try {
    const data = await api('GET', '/pool/list');
    const list = data.accounts || [];
    $('listMsg').style.display = list.length ? 'none' : 'block';
    $('listMsg').textContent = list.length ? '' : '池里还没有账号，先在上面添加';
    $('tbody').innerHTML = list.map((a, i) => `
      <tr>
        <td>${a.index + 1}</td>
        <td>${esc(a.email)}</td>
        <td>${statusTag(a)}</td>
        <td>${a.failCount}</td>
        <td>${fmtTime(a.lastUsed)}</td>
        <td>
          <button onclick="testOne(${i})">测活</button>
          <button onclick="toggleOne(${i}, ${!a.disabled})">${a.disabled ? '启用' : '禁用'}</button>
          <button class="danger" onclick="removeOne(${i})">删除</button>
        </td>
      </tr>`).join('');
    if (list.length) show('listMsg', '', true);
  } catch (e) {
    $('tbody').innerHTML = '';
    show('listMsg', '加载失败: ' + e.message);
  }
}

async function addOne() {
  try {
    await api('POST', '/pool/add', { email: $('email').value.trim(), password: $('password').value });
    show('addMsg', '已添加', true);
    $('email').value = ''; $('password').value = '';
    loadList();
  } catch (e) { show('addMsg', e.message); }
}

async function importBulk() {
  // 每行一个账号，格式 email:密码（各账号密码可不同）
  const lines = $('bulkEmails').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return show('addMsg', '没有可导入的账号');
  const items = [];
  for (const line of lines) {
    const idx = line.indexOf(':');
    if (idx <= 0) return show('addMsg', `格式错误（应为 email:密码）: ${line}`);
    items.push({ email: line.slice(0, idx).trim(), password: line.slice(idx + 1).trim() });
  }
  try {
    const r = await api('POST', '/pool/import-bulk', { accounts: items });
    show('addMsg', `导入 ${r.added.length} 个` + (r.skipped.length ? `，跳过（已存在）${r.skipped.length} 个` : ''), true);
    $('bulkEmails').value = '';
    loadList();
  } catch (e) { show('addMsg', e.message); }
}

// 按列表下标操作（email 由服务器返回，避免拼进 HTML 属性）
async function testOne(i) {
  try {
    const { accounts } = await api('GET', '/pool/list');
    const email = accounts[i].email;
    const r = await api('GET', '/pool/test?email=' + encodeURIComponent(email));
    alert(r.live ? `✅ ${email} 登录成功` : `❌ ${email}: ${r.error || '登录失败'}`);
  } catch (e) { alert('测活失败: ' + e.message); }
}

async function toggleOne(i, disabled) {
  try {
    const { accounts } = await api('GET', '/pool/list');
    const email = accounts[i].email;
    await api('POST', '/pool/toggle', { email, disabled });
    loadList();
  } catch (e) { alert(e.message); }
}

async function removeOne(i) {
  try {
    const { accounts } = await api('GET', '/pool/list');
    const email = accounts[i].email;
    if (!confirm(`确定删除 ${email}？`)) return;
    await api('POST', '/pool/remove', { email });
    loadList();
  } catch (e) { alert(e.message); }
}

$('adminToken').value = getToken();
if (getToken()) loadList();
</script>
</body>
</html>
